{% extends 'base.html' %} {% block title %} Beranda {% endblock %}

<!-- Hero -->
{% block content %}
<div class="container-fluid">
    <div class="container">
        <div class="row flex-lg-row-reverse align-items-center g-5 py-5">
            <div class="col-10 col-sm-8 col-lg-6">
                <img
                    src="{{ url_for('static', filename='hero.jpg') }}"
                    class="d-block mx-lg-auto img-fluid"
                    alt="Bootstrap Themes"
                    loading="lazy"
                />
            </div>
            <div class="col-lg-6">
                <h1 class="display-5 fw-bold lh-1 mb-3">
                    Indonesian Image Caption Generator
                </h1>
                <p class="lead">
                    Dapatkan keterangan gambar secara otomatis dalam Bahasa
                    Indonesia hanya dengan sekali klik!
                </p>
                <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                    <a
                        href="/coba"
                        class="btn btn-primary btn-lg px-4 py-2 me-md-2"
                    >
                        Coba Sekarang!
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

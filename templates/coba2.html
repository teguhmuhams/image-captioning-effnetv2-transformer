{% extends 'base.html' %} {% block title %} Coba Aplikasi {% endblock %} {%
block content %}
<div
    class="container-fluid d-flex flex-column justify-content-center align-items-center text-center"
    style="min-height: 75vh"
>
    <div class="d-flex flex-column text-primary fw-bold">
        <h1>Indonesian Image Caption Generator</h1>
        <p class="lead">Unggah gambar untuk mulai!</p>
        <img id="previewImage" src="{{ url_for('static',
        filename='placeholder.png') }}" class="my-3" alt="Preview image"
        loading="lazy" = />
        <form
            id="uploadForm"
            action="/upload"
            method="post"
            enctype="multipart/form-data"
        >
            <input class="form-control" id="upload" name="file" type="file" />
            <input type="hidden" name="scale" value="m" />
            <div class="row">
                <div class="col-lg-12">
                    <button
                        id="btnSubmit"
                        type="submit"
                        class="btn btn-primary mt-3 w-100"
                    >
                        Unggah
                    </button>
                </div>
            </div>
        </form>

        <p class="lead my-3">Hasil Prediksi:</p>
        <p id="output" class="lead"></p>
    </div>
</div>

<script>
    document.getElementById("upload").addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById("previewImage").src = e.target.result;
            };
            reader.readAsDataURL(file);
            document.getElementById("btnSubmit").textContent = "Buat caption";
        }
    });

    document
        .getElementById("uploadForm")
        .addEventListener("submit", function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch("/upload", {
                method: "POST",
                body: formData,
            })
                .then((response) => response.json())
                .then((data) => {
                    document.querySelector("#output").textContent =
                        data.caption; // Adjust this based on your JSON structure
                })
                .catch((error) => console.error("Error:", error));
        });
</script>

{% endblock %}
